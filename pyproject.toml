[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pauli-hamiltonian-evolution"
version = "0.1.0"
description = "Circuit synthesis, Trotterization, and control errors for Pauli Hamiltonian evolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pylatexenc>=2.10",
    "qiskit>=1.0",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
